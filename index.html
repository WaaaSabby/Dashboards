<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sabby's Dashboards</title>
<style>
:root{--bg:#0b0912;--panel:#151022;--panel2:#1d1532;--line:#2c2244;--p:#a970ff;--t:#ece8f5;--m:#9a90b3;--live:#3ddc97}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:28px 16px 48px}
header h1{margin:0;font-size:26px;letter-spacing:.5px}
header h1 span{color:var(--p)}
header p{margin:4px 0 0;color:var(--m);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:22px}
.tile{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:18px;transition:border-color .15s,transform .15s}
.tile.live:hover{border-color:var(--p);transform:translateY(-2px)}
.tile.off{opacity:.55}
.main{display:block;color:inherit;text-decoration:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.code{font-weight:800;font-size:22px;color:var(--p);letter-spacing:1px}
.badge{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--m);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.badge.today{color:#08130e;background:var(--live);border-color:var(--live)}
.name{margin-top:2px;color:var(--m);font-size:13px}
.slate{margin-top:12px;font-weight:600;min-height:21px}
.when{color:var(--m);font-size:12px;margin-top:2px;min-height:18px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:12px;color:var(--m)}
.foot a{color:var(--p);text-decoration:none;font-weight:600}
.strip{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.strip .lbl{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--m);margin:0 0 8px 2px}
.strip .row{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:6px}
.chip{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);text-decoration:none;color:var(--t);font-size:13px}
a.chip:hover{border-color:var(--p)}
.chip b{color:var(--p);letter-spacing:.5px}
.chip span{color:var(--m);font-size:12px;white-space:nowrap}
.chip.fresh span{color:var(--live);font-weight:600}
.chip.none{opacity:.5}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>Sabby's <span>Dashboards</span></h1>
<p>Tap a sport for the latest slate.</p>
</header>
<div class="strip" id="strip"></div>
<div class="grid" id="grid"></div>
</div>
<script>
var SPORTS=[["mlb","MLB","Baseball"],["nhl","NHL","Hockey"],["nfl","NFL","Football"],["cfb","CFB","College football"],["nba","NBA","Basketball"],["wnba","WNBA","Basketball"],["soccer","SOCCER","Soccer"]];
var TZ="America/Toronto";
function dayKey(d){return d.toLocaleDateString("en-CA",{timeZone:TZ})}
function fmt(d){return d.toLocaleDateString("en-US",{timeZone:TZ,weekday:"short",month:"short",day:"numeric"})+" · "+d.toLocaleTimeString("en-US",{timeZone:TZ,hour:"numeric",minute:"2-digit"})+" ET"}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var STALE_DAYS=21;
function shown(data){
  var cut=Date.now()-STALE_DAYS*864e5;
  return SPORTS.filter(function(s){
    var info=(data&&data[s[0]])||{};
    if(info.hidden) return false;
    if(!info.updated) return false;
    return new Date(info.updated).getTime()>=cut;
  }).sort(function(a,b){
    return new Date(data[b[0]].updated).getTime()-new Date(data[a[0]].updated).getTime();
  });
}
function render(data){
  var g=document.getElementById("grid"),html="",today=dayKey(new Date()),LIST=shown(data);
  if(!LIST.length){g.innerHTML='<p style="color:var(--m)">No dashboards posted right now.</p>';document.getElementById("strip").style.display="none";return}
  LIST.forEach(function(s){
    var k=s[0],info=(data&&data[k])||{},up=info.updated?new Date(info.updated):null;
    var n=(info.archive||[]).length,badge,cls;
    if(!up){badge='<span class="badge">Not posted</span>';cls="off"}
    else if(dayKey(up)===today){badge='<span class="badge today">Today</span>';cls="live"}
    else{badge='<span class="badge">'+up.toLocaleDateString("en-US",{timeZone:TZ,month:"short",day:"numeric"})+'</span>';cls="live"}
    var body='<div class="top"><div class="code">'+s[1]+'</div>'+badge+'</div><div class="name">'+s[2]+'</div><div class="slate">'+esc(info.slate||(up?"":"No dashboard yet"))+'</div><div class="when">'+(up?"Updated "+fmt(up):"")+'</div>';
    var main=up?'<a class="main" href="'+k+'/?v='+up.getTime()+'">'+body+'</a>':'<div class="main">'+body+'</div>';
    var foot='<div class="foot"><span>'+n+' past slate'+(n===1?"":"s")+'</span>'+(n?'<a href="archive.html?s='+k+'">Past slates →</a>':"")+'</div>';
    html+='<div class="tile '+cls+'">'+main+foot+'</div>';
  });
  g.innerHTML=html;
  var chips="";
  LIST.forEach(function(s){
    var k=s[0],info=(data&&data[k])||{},up=info.updated?new Date(info.updated):null,when,cls;
    if(!up){when="Not posted";cls="none"}
    else if(dayKey(up)===today){when="Today "+up.toLocaleTimeString("en-US",{timeZone:TZ,hour:"numeric",minute:"2-digit"});cls="fresh"}
    else{when=up.toLocaleDateString("en-US",{timeZone:TZ,month:"short",day:"numeric"})+" "+up.toLocaleTimeString("en-US",{timeZone:TZ,hour:"numeric",minute:"2-digit"});cls=""}
    var inner='<b>'+s[1]+'</b><span>'+when+'</span>';
    chips+=up?'<a class="chip '+cls+'" href="'+k+'/?v='+up.getTime()+'">'+inner+'</a>':'<div class="chip '+cls+'">'+inner+'</div>';
  });
  document.getElementById("strip").innerHTML='<div class="lbl">Last updated (ET)</div><div class="row">'+chips+'</div>';
}
fetch("updates.json?t="+Date.now()).then(function(r){return r.json()}).catch(function(){return {}}).then(render);
</script>
</body>
</html>
